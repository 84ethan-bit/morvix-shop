services:
  - type: web
    name: morvix-shop
    runtime: python
    region: virginia
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install playwright && python -m playwright install --with-deps chromium
    startCommand: python worker/morvix_render_worker.py
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright-cache
      - key: PYTHONUNBUFFERED
        value: "1"

services:
  - type: web
    name: morvix-shop
    runtime: python
    region: virginia
    plan: free
    pythonVersion: "3.11.0"
    buildCommand: pip install --upgrade pip setuptools wheel && pip install playwright && python -m playwright install chromium && python -m playwright install-deps chromium
    startCommand: python worker/morvix_render_worker.py
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.playwright-cache
      - key: PYTHONUNBUFFERED
        value: "1"

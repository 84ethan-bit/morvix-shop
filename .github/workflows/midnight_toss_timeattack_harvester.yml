# 🌐 MORVIX SHOP - Pure Repository & Static Deployment Workflow
# (GitHub Actions does NOT crawl Toss. Crawling is strictly 100% isolated to the External Server.)

name: 🌐 Static Deployment Listener

on:
  push:
    branches:
      - main

jobs:
  static-deploy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Verify Repository Integrity
        run: |
          echo "✅ GitHub Repository received commit from External Server."
          echo "✅ Vercel static deployment will auto-trigger via GitHub webhook."

name: 🌐 External Server Auto-Harvester Daemon

on:
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  run-harvester:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Playwright & Dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Execute Standalone Toss Harvester Core
        run: |
          python worker/sharelink_toss_harvester.py

      - name: Commit & Push Updated DB to Vercel (Guarded against empty DBs)
        run: |
          git config --global user.name "MORVIX External Server Bot"
          git config --global user.email "bot@morvix.io"
          # Only commit if morvix_shop_db.json contains products
          python -c "import json; db=json.load(open('morvix_shop_db.json')); exit(0 if len(db.get('products',[]))>0 else 1)" && (
            git add morvix_shop_db.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cron): Auto-ingest latest Toss deals from external server" && git push)
          ) || echo "ℹ️ DB contains 0 items, skipping git push to protect live production site."

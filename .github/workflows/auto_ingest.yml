name: ⚡ MORVIX Cloud Auto Ingestion & Deploy Workflow

on:
  repository_dispatch:
    types: [auto_ingest]
  workflow_dispatch:
    inputs:
      product_url:
        description: 'Naver Connect or Coupang Partners Link'
        required: true
        default: ''

jobs:
  cloud_ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Playwright & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4
          playwright install --with-deps chromium

      - name: 🤖 Execute Cloud Product Extractor & Ingestion Engine
        env:
          TARGET_URL: ${{ github.event.client_payload.url || github.event.inputs.product_url }}
        run: |
          python worker/extract_and_commit.py "$TARGET_URL"

      - name: 🚀 Commit & Push Updated Master DB to GitHub
        run: |
          git config --global user.name "morvix-bot[bot]"
          git config --global user.email "bot@morvix.kr"
          git add morvix_shop_db.json
          git commit -m "auto: ⚡ MORVIX Cloud Auto Ingestion & Deploy [$(date -u +'%Y-%m-%dT%H:%M:%SZ')]" || echo "No DB changes to commit"
          git push origin main
